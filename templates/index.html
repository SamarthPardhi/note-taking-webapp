<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Alpha</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <nav class="nav-bar" id="nav">
        <div class="nav-left">
            <div class="nav-logo">Project Alpha</div>
        </div>
        <div class="nav-actions">
            <div class="theme-selector">
                <div class="theme-dot" data-theme="paper"></div>
                <div class="theme-dot" data-theme="light"></div>
                <div class="theme-dot" data-theme="dark"></div>
            </div>
            <a href="{{ url_for('settings') }}" class="nav-link">Settings</a>
            {% if is_admin %}
            <a href="{{ url_for('admin_dashboard') }}" class="nav-link">Admin</a>
            {% endif %}
            <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
        </div>
    </nav>

    <div class="input-zone">
        <div class="input-card">
            <textarea 
                id="input" 
                class="input-field" 
                placeholder="Write something..."
                autofocus></textarea>
            <div class="input-controls">
                <input 
                    id="label-input" 
                    class="label-input" 
                    type="text" 
                    placeholder="Label (optional)"
                    list="label-suggestions">
                <datalist id="label-suggestions">
                    </datalist>
                <button class="save-btn" id="save-btn">Save</button>
            </div>
        </div>
    </div>

    <div class="search-bar">
        <div class="search-input-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input 
                type="text" 
                id="search-input" 
                class="search-input" 
                placeholder="Search">
        </div>
    </div>

    <div class="filter-bar" id="filter-bar">
        <div class="filter-chip active" data-filter="all">All</div>
        </div>

    <div class="notes-container" id="notes-container"></div>

    <div class="empty-state" id="empty-state" style="display: none;">
        <h3>No notes yet</h3>
        <p>Start writing above</p>
    </div>

    <div class="note-viewer" id="note-viewer">
        <div class="viewer-content">
            <div class="viewer-header">
                <div class="viewer-meta">
                    <span class="viewer-label-display" id="viewer-label"></span>
                    <input type="text" id="viewer-label-edit" class="viewer-label-edit" style="display: none;">
                    <span class="viewer-datetime" id="viewer-datetime"></span>
                </div>
                <div class="viewer-actions">
                    <button class="viewer-btn" id="close-viewer">Close</button>
                    <button class="viewer-btn primary" id="edit-note">Edit</button>
                    <button class="viewer-btn danger" id="delete-note">Delete</button>
                </div>
            </div>
            <div class="viewer-body">
                <div class="note-read" id="note-read"></div>
                <textarea class="note-edit-area" id="note-edit" style="display: none;"></textarea>
            </div>
        </div>
    </div>

    <script>
        // ===== STATE =====
        const html = document.documentElement;
        const nav = document.getElementById('nav');
        const input = document.getElementById('input');
        const labelInput = document.getElementById('label-input');
        const saveBtn = document.getElementById('save-btn');
        const filterBar = document.getElementById('filter-bar');
        const notesContainer = document.getElementById('notes-container');
        const emptyState = document.getElementById('empty-state');
        const searchInput = document.getElementById('search-input');
        const noteViewer = document.getElementById('note-viewer');
        const viewerLabel = document.getElementById('viewer-label');
        const viewerLabelEdit = document.getElementById('viewer-label-edit');
        const viewerDatetime = document.getElementById('viewer-datetime');
        const noteRead = document.getElementById('note-read');
        const noteEdit = document.getElementById('note-edit');
        const closeViewer = document.getElementById('close-viewer');
        const editNoteBtn = document.getElementById('edit-note');
        const deleteNoteBtn = document.getElementById('delete-note');

        let currentFilter = 'all';
        let currentNoteId = null;
        let isEditing = false;
        
        // Load initial labels from backend
        const initialLabels = {{ labels|tojson }};
        let allLabels = new Set(initialLabels);
        if (allLabels.size === 0) allLabels.add('idea');

        let recentLabels = JSON.parse(localStorage.getItem('recentLabels') || '[]');
        
        // Recover last used label
        const lastUsedLabel = localStorage.getItem('lastLabel');
        if (lastUsedLabel) {
            labelInput.value = lastUsedLabel;
        }

        // First Time User Check
        const isFirstTime = initialLabels.length === 0 || (initialLabels.length === 1 && initialLabels[0] === 'idea');
        if (isFirstTime && !lastUsedLabel) {
            labelInput.placeholder = "Create a label (Required)";
            labelInput.required = true;
        }

        // ===== AUTO-RESIZE TEXTAREA =====
        input.addEventListener('input', function() {
            this.style.height = 'auto'; // Reset height
            this.style.height = (this.scrollHeight) + 'px'; // Set to scroll height
        });

        // ===== INITIALIZE FILTER BAR =====
        function initFilterBar() {
            // 1. Attach listener to the static "All" chip
            const allChip = document.querySelector('.filter-chip[data-filter="all"]');
            allChip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                allChip.classList.add('active');
                currentFilter = 'all';
                fetchNotes();
            });

            // 2. Clear other existing chips (if any reload happens)
            const existing = Array.from(filterBar.children);
            existing.forEach(child => {
                if (child.dataset.filter !== 'all') child.remove();
            });

            // 3. Add dynamic chips
            Array.from(allLabels).sort().forEach(label => {
                if(label === 'idea' && allLabels.size > 1 && !initialLabels.includes('idea')) return; 
                addFilterChip(label);
            });
        }

        function addFilterChip(label) {
             if (document.querySelector(`.filter-chip[data-filter="${label}"]`)) return;

            const chip = document.createElement('div');
            chip.className = 'filter-chip';
            chip.dataset.filter = label;
            chip.textContent = label.charAt(0).toUpperCase() + label.slice(1);
            chip.addEventListener('click', () => {
                document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                currentFilter = label;
                fetchNotes();
            });
            filterBar.appendChild(chip);
        }

        function updateLabelSuggestions() {
            const datalist = document.getElementById('label-suggestions');
            datalist.innerHTML = '';
            recentLabels.forEach(label => {
                const option = document.createElement('option');
                option.value = label;
                datalist.appendChild(option);
            });
            allLabels.forEach(label => {
                if (!recentLabels.includes(label)) {
                    const option = document.createElement('option');
                    option.value = label;
                    datalist.appendChild(option);
                }
            });
        }

        function trackLabelUsage(label) {
            recentLabels = recentLabels.filter(l => l !== label);
            recentLabels.unshift(label);
            recentLabels = recentLabels.slice(0, 5);
            localStorage.setItem('recentLabels', JSON.stringify(recentLabels));
            localStorage.setItem('lastLabel', label);
            updateLabelSuggestions();
        }

        // ===== THEME SYSTEM (PERSISTENT & SYNCED) =====
        const savedTheme = '{{ user_theme if user_theme else "paper" }}';
        html.setAttribute('data-theme', savedTheme);
        localStorage.setItem('theme', savedTheme);

        window.addEventListener('storage', (e) => {
            if (e.key === 'theme') {
                const newTheme = e.newValue;
                html.setAttribute('data-theme', newTheme);
                document.querySelectorAll('.theme-dot').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === newTheme);
                });
            }
        });

        document.querySelectorAll('.theme-dot').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.theme === savedTheme);
            btn.addEventListener('click', async () => {
                const theme = btn.dataset.theme;
                html.setAttribute('data-theme', theme);
                localStorage.setItem('theme', theme); 
                
                document.querySelectorAll('.theme-dot').forEach(b => 
                    b.classList.toggle('active', b === btn));
                
                try {
                    await fetch('/update_theme', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ theme })
                    });
                } catch (e) {
                    console.error('Failed to save theme:', e);
                }
            });
        });

        // ===== DISAPPEARING NAV =====
        let lastScroll = 0;
        window.addEventListener('scroll', () => {
            const currentScroll = window.pageYOffset;
            if (currentScroll > 100 && currentScroll > lastScroll) {
                nav.classList.add('hidden');
            } else {
                nav.classList.remove('hidden');
            }
            lastScroll = currentScroll;
        });

        // ===== SAVE NOTE =====
        async function saveNote() {
            const content = input.value.trim();
            if (!content) return;

            let label = labelInput.value.trim().toLowerCase();
            
            if (allLabels.size <= 1 && (allLabels.has('idea') || allLabels.size === 0)) {
                if (!label || label === 'idea') {
                    labelInput.classList.add('error');
                    labelInput.placeholder = "Please create a custom label first!";
                    labelInput.focus();
                    return;
                }
            }

            if (!label) {
                label = localStorage.getItem('lastLabel') || 'idea';
            }
            
            labelInput.classList.remove('error');
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;

            try {
                if (!allLabels.has(label)) {
                    await fetch('/add_label', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ label })
                    });
                    allLabels.add(label);
                    addFilterChip(label);
                    
                    const option = document.createElement('option');
                    option.value = label;
                    document.getElementById('label-suggestions').appendChild(option);
                }

                const res = await fetch('/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, label })
                });

                if (res.ok) {
                    input.value = '';
                    input.style.height = 'auto'; // Reset height after save
                    input.style.minHeight = '100px';

                    labelInput.value = label; 
                    trackLabelUsage(label);
                    
                    saveBtn.textContent = 'Saved';
                    setTimeout(() => {
                        saveBtn.textContent = 'Save';
                        saveBtn.disabled = false;
                    }, 600);
                    fetchNotes();
                }
            } catch (e) {
                saveBtn.textContent = 'Error';
                saveBtn.disabled = false;
            }
        }

        saveBtn.addEventListener('click', saveNote);

        input.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                e.preventDefault();
                saveNote();
            }
        });
        
        labelInput.addEventListener('input', () => {
             labelInput.classList.remove('error');
        });

        // ===== MARKDOWN =====
        marked.setOptions({ breaks: true, sanitize: false });

        function renderMath(el) {
            if (typeof renderMathInElement !== 'undefined') {
                renderMathInElement(el, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false }
                    ]
                });
            }
        }

        // ===== FETCH NOTES =====
        async function fetchNotes() {
            const searchQuery = searchInput.value.trim();
            try {
                const res = await fetch(`/notes?label=${currentFilter}&search=${encodeURIComponent(searchQuery)}`);
                const notes = await res.json();

                notes.forEach(note => {
                    if(!allLabels.has(note.label)) {
                        allLabels.add(note.label);
                        addFilterChip(note.label);
                    }
                });

                notesContainer.innerHTML = '';

                if (notes.length === 0) {
                    emptyState.style.display = 'block';
                    notesContainer.style.display = 'none';
                } else {
                    emptyState.style.display = 'none';
                    notesContainer.style.display = 'flex';

                    notes.forEach((note, index) => {
                        const card = document.createElement('div');
                        card.className = 'note-card';
                        card.style.animationDelay = `${index * 0.03}s`;

                        const date = new Date(note.timestamp);
                        const dateStr = date.toLocaleDateString('en-US', {
                            month: 'short',
                            day: 'numeric',
                            year: 'numeric'
                        });
                        const timeStr = date.toLocaleTimeString('en-US', {
                            hour: 'numeric',
                            minute: '2-digit',
                            hour12: true
                        });

                        const renderedContent = marked.parse(note.content);

                        card.innerHTML = `
                            <div class="note-header">
                                <span class="note-label">${note.label}</span>
                                <div class="note-meta">
                                    <span class="note-date">${dateStr}</span>
                                    <span class="note-time">${timeStr}</span>
                                </div>
                            </div>
                            <div class="note-content note-content-clamp">${renderedContent}</div>
                        `;

                        renderMath(card);
                        card.addEventListener('click', () => openNote(note));
                        notesContainer.appendChild(card);
                    });
                }
            } catch (e) {
                console.error('Failed to fetch notes:', e);
            }
        }

        // ===== NOTE VIEWER =====
        function openNote(note) {
            currentNoteId = note.id;
            isEditing = false;

            viewerLabel.textContent = note.label;
            viewerLabel.style.display = 'block';
            viewerLabelEdit.style.display = 'none';
            viewerLabelEdit.value = note.label;

            const date = new Date(note.timestamp);
            const isMobile = window.innerWidth <= 768;
            
            const dateStr = date.toLocaleDateString('en-US', {
                month: isMobile ? 'short' : 'long',
                day: 'numeric',
                year: 'numeric'
            });
            const timeStr = date.toLocaleTimeString('en-US', {
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
            viewerDatetime.textContent = `${dateStr} • ${timeStr}`;

            noteRead.innerHTML = marked.parse(note.content);
            renderMath(noteRead);
            
            noteEdit.value = note.content;

            noteRead.style.display = 'block';
            noteEdit.style.display = 'none';
            editNoteBtn.textContent = 'Edit';

            noteViewer.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeViewerFunc() {
            noteViewer.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeViewer.addEventListener('click', closeViewerFunc);

        noteViewer.addEventListener('click', (e) => {
            if (e.target === noteViewer) {
                closeViewerFunc();
            }
        });

        editNoteBtn.addEventListener('click', async () => {
            if (!isEditing) {
                isEditing = true;
                noteRead.style.display = 'none';
                noteEdit.style.display = 'block';
                viewerLabel.style.display = 'none';
                viewerLabelEdit.style.display = 'block';
                editNoteBtn.textContent = 'Save';
                noteEdit.focus();
            } else {
                editNoteBtn.textContent = 'Saving...';
                editNoteBtn.disabled = true;

                const newLabel = viewerLabelEdit.value.trim() || viewerLabel.textContent;

                try {
                    await fetch('/update', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            filename: currentNoteId,
                            content: noteEdit.value,
                            label: newLabel
                        })
                    });

                    viewerLabel.textContent = newLabel;
                    noteRead.innerHTML = marked.parse(noteEdit.value);
                    renderMath(noteRead);
                    
                    noteRead.style.display = 'block';
                    noteEdit.style.display = 'none';
                    viewerLabel.style.display = 'block';
                    viewerLabelEdit.style.display = 'none';
                    
                    editNoteBtn.textContent = 'Edit';
                    editNoteBtn.disabled = false;
                    isEditing = false;
                    
                    if(!allLabels.has(newLabel)) {
                        allLabels.add(newLabel);
                        addFilterChip(newLabel);
                    }
                    trackLabelUsage(newLabel);

                    fetchNotes();
                } catch (e) {
                    editNoteBtn.textContent = 'Error';
                    editNoteBtn.disabled = false;
                }
            }
        });

        deleteNoteBtn.addEventListener('click', async () => {
            if (confirm('Delete this note?')) {
                try {
                    await fetch('/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: currentNoteId })
                    });
                    closeViewerFunc();
                    fetchNotes();
                } catch (e) {
                    alert('Failed to delete');
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeViewerFunc();
            }
        });

        let searchTimeout;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                fetchNotes();
            }, 300);
        });

        initFilterBar();
        updateLabelSuggestions();
        fetchNotes();
    </script>
</body>
</html>
