<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Project Alpha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-slate-50 p-6 md:p-10">
    <div class="max-w-6xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <h1 class="text-3xl font-bold text-slate-800 flex items-center gap-3">
                <i class="fas fa-shield-alt text-slate-900"></i> Admin Dashboard
            </h1>
            <a href="{{ url_for('index') }}" class="btn-primary px-4 py-2 rounded-lg text-sm shadow-sm flex items-center gap-2">
                <i class="fas fa-arrow-left"></i> Back to App
            </a>
        </div>

        <div class="card-base overflow-hidden bg-white">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h2 class="text-lg font-bold text-slate-700">User Management</h2>
                <span class="text-xs font-bold bg-slate-200 text-slate-600 px-3 py-1 rounded-full">Total Users: {{ users|length }}</span>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-white border-b border-slate-100">
                        <tr>
                            <th class="px-6 py-4 font-bold text-slate-400 uppercase text-xs tracking-wider">ID</th>
                            <th class="px-6 py-4 font-bold text-slate-400 uppercase text-xs tracking-wider">Name</th>
                            <th class="px-6 py-4 font-bold text-slate-400 uppercase text-xs tracking-wider">Email</th>
                            <th class="px-6 py-4 font-bold text-slate-400 uppercase text-xs tracking-wider">Reference</th>
                            <th class="px-6 py-4 font-bold text-slate-400 uppercase text-xs tracking-wider">Token</th>
                            <th class="px-6 py-4 font-bold text-slate-400 uppercase text-xs tracking-wider">Action</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-50">
                        {% for user in users %}
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-6 py-4 font-mono text-slate-400">#{{ user.id }}</td>
                            <td class="px-6 py-4 font-bold text-slate-700">{{ user.name }}</td>
                            <td class="px-6 py-4 text-slate-600">{{ user.email }}</td>
                            <td class="px-6 py-4 text-slate-500 italic">{{ user.reference or '-' }}</td>
                            <td class="px-6 py-4">
                                <span class="font-mono bg-slate-100 text-slate-700 px-2 py-1 rounded border border-slate-200 select-all font-bold">{{ user.token }}</span>
                            </td>
                            <td class="px-6 py-4">
                                <a href="mailto:{{ user.email }}?subject=Project Alpha Access&body=Hi {{ user.name }},%0D%0A%0D%0AHere is your access token: {{ user.token }}" class="text-blue-600 hover:text-blue-800 font-bold flex items-center gap-1">
                                    <i class="fas fa-paper-plane"></i> Send
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
