<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zazu | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 flex items-center">
            <i class="fas fa-lock text-red-500 mr-3"></i> Admin Dashboard
        </h1>

        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-3">Access Information</h2>
            <div class="bg-yellow-100 text-yellow-800 p-3 rounded-md border border-yellow-300">
                <p class="font-mono text-sm">DEVELOPMENT TOKEN: <strong>{{ token }}</strong></p>
            </div>
            <a href="{{ url_for('index') }}" class="mt-4 inline-block text-blue-500 hover:underline text-sm"><i class="fas fa-arrow-left mr-1"></i> Back to Notes</a>
        </div>

        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Registered Users</h2>
            <table class="min-w-full text-left text-sm whitespace-nowrap">
                <thead class="uppercase tracking-wider border-b-2 border-gray-200 bg-gray-50">
                    <tr>
                        <th class="px-6 py-4 font-bold text-gray-600">ID</th>
                        <th class="px-6 py-4 font-bold text-gray-600">Name</th>
                        <th class="px-6 py-4 font-bold text-gray-600">Email</th>
                        <th class="px-6 py-4 font-bold text-gray-600">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr class="border-b border-gray-100 hover:bg-gray-50">
                        <td class="px-6 py-4 font-medium">{{ user.id }}</td>
                        <td class="px-6 py-4">{{ user.name }}</td>
                        <td class="px-6 py-4 font-mono text-blue-600">{{ user.email }}</td>
                        <td class="px-6 py-4">
                            <a href="mailto:{{ user.email }}?subject=Zazu Token&body=Token: {{ token }}" class="text-blue-500 hover:underline">
                                <i class="fas fa-envelope mr-1"></i> Send Token
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
