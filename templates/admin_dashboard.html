<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Project Alpha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .admin-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .admin-header {
            margin-bottom: 48px;
        }

        .admin-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .admin-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 48px;
        }

        .stat {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 12px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .user-list {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .user-list-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            font-weight: 600;
        }

        .user-item {
            display: grid;
            grid-template-columns: 2fr 2fr 1fr 1fr;
            gap: 16px;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        .user-item:last-child {
            border-bottom: none;
        }

        .user-item:hover {
            background: var(--bg);
        }

        .user-name {
            font-weight: 500;
        }

        .user-email {
            color: var(--text-secondary);
        }

        .user-token {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            background: var(--bg);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .send-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .send-link:hover {
            opacity: 0.7;
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .back-link:hover {
            color: var(--text);
        }

        @media (max-width: 768px) {
            .user-item {
                grid-template-columns: 1fr;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="admin-page">
        <a href="{{ url_for('index') }}" class="back-link">← Back</a>

        <div class="admin-header">
            <h1>Admin Control</h1>
            <p>User management</p>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-value">{{ users|length }}</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat">
                <div class="stat-value">{{ users|length }}</div>
                <div class="stat-label">Active Tokens</div>
            </div>
            <div class="stat">
                <div class="stat-value">{{ users|selectattr('is_admin')|list|length }}</div>
                <div class="stat-label">Admins</div>
            </div>
        </div>

        <div class="user-list">
            <div class="user-list-header">Users</div>
            {% for user in users %}
            <div class="user-item">
                <div class="user-name">{{ user.name }}</div>
                <div class="user-email">{{ user.email }}</div>
                <div class="user-token">{{ user.token }}</div>
                <a href="mailto:{{ user.email }}?subject=Project Alpha Access&body=Hi {{ user.name }},%0D%0A%0D%0AYour access token: {{ user.token }}" 
                   class="send-link">Send</a>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = "{{ url_for('index') }}";
            }
        });
    </script>
</body>
</html>
