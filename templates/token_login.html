<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zazu | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center bg-slate-100">
    <div class="w-full max-w-sm p-6">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
            <div class="text-center mb-8">
                <div class="w-12 h-12 bg-slate-900 text-white rounded-xl flex items-center justify-center mx-auto mb-4 text-xl">
                    <i class="fas fa-feather-alt"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">Zazu Notes</h1>
                <p class="text-slate-500 text-sm mt-1">Enter your access token</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-3 rounded-lg text-sm text-center {{ 'bg-red-50 text-red-600' if category == 'error' else 'bg-blue-50 text-blue-600' }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('token_login_route') }}" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Access Token</label>
                    <input type="password" name="token" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-slate-900 focus:outline-none transition" placeholder="••••••">
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 rounded-lg transition shadow-lg">
                    Grant Access
                </button>
            </form>
            
            <button id="signup-modal-btn" class="w-full text-center text-xs text-blue-500 hover:text-blue-700 mt-4 font-medium">
                Request Access / Sign Up
            </button>
        </div>
        <p class="text-center text-xs text-slate-400 mt-6">
            Private Development Build <br>
            Support: {{ support_email }}
        </p>
    </div>

    <div class="hidden fixed inset-0 bg-black bg-opacity-30 backdrop-blur-sm z-50 items-center justify-center" id="signup-modal">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-11/12 max-w-sm">
            <h2 class="text-xl font-bold text-gray-800 mb-4">New User Sign Up</h2>
            <div id="signup-message" class="text-sm p-3 hidden rounded-md mb-4"></div>
            <form id="signup-form">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input type="text" id="name" name="name" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                    <input type="email" id="email" name="email" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 rounded-lg hover:bg-blue-700">Submit Request</button>
            </form>
            <button id="close-signup-modal" class="w-full text-center text-xs text-gray-500 mt-4 hover:underline">Close</button>
        </div>
    </div>
    
    <script>
        const signupModal = document.getElementById('signup-modal');
        const signupModalBtn = document.getElementById('signup-modal-btn');
        const closeSignupModalBtn = document.getElementById('close-signup-modal');
        const signupForm = document.getElementById('signup-form');
        const signupMessage = document.getElementById('signup-message');

        signupModalBtn.addEventListener('click', () => {
            signupModal.classList.remove('hidden');
            signupModal.classList.add('flex');
            signupMessage.classList.add('hidden');
        });

        closeSignupModalBtn.addEventListener('click', () => {
            signupModal.classList.add('hidden');
            signupModal.classList.remove('flex');
        });

        signupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });
                const data = await response.json();
                signupMessage.classList.remove('hidden', 'bg-red-100', 'text-red-800', 'bg-green-100', 'text-green-800');
                if (response.ok) {
                    signupMessage.textContent = data.message;
                    signupMessage.classList.add('bg-green-100', 'text-green-800');
                    signupForm.reset();
                } else {
                    signupMessage.textContent = data.error || 'Error occurred.';
                    signupMessage.classList.add('bg-red-100', 'text-red-800');
                }
            } catch (error) {
                signupMessage.textContent = 'Network error.';
                signupMessage.classList.add('bg-red-100', 'text-red-800');
                signupMessage.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
