<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | Project Alpha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">
    
    <header class="top-nav">
        <div class="flex items-center gap-4">
            <a href="{{ url_for('index') }}" class="flex items-center gap-3 group">
                <div class="bg-slate-900 text-white w-8 h-8 rounded-lg flex items-center justify-center shadow-lg group-hover:bg-black transition">
                    <i class="fas fa-feather-alt text-xs"></i>
                </div>
                <span class="font-bold text-slate-900 text-lg tracking-tight group-hover:text-black">Project Alpha</span>
            </a>
        </div>

        <div class="flex items-center gap-6">
            {% if current_user.is_admin %}
            <a href="{{ url_for('admin_dashboard') }}" class="nav-link-top text-blue-600">
                <i class="fas fa-shield-alt"></i> <span class="hidden sm:inline">Admin</span>
            </a>
            {% endif %}
            
            <div class="nav-link-top active cursor-default">
                <i class="fas fa-cog"></i> <span class="hidden sm:inline">Settings</span>
            </div>
            
            <a href="{{ url_for('logout') }}" class="nav-link-top danger">
                <i class="fas fa-sign-out-alt"></i> <span class="hidden sm:inline">Logout</span>
            </a>

            <div class="h-6 w-px bg-slate-200 mx-1"></div>

            <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-xs font-bold border border-slate-300 cursor-default">
                {{ current_user.name[:2].upper() }}
            </div>
        </div>
    </header>

    <main class="content-body flex-1 flex items-start justify-center pt-10">
        
        <div class="w-full max-w-2xl">
            <a href="{{ url_for('index') }}" class="inline-flex items-center text-slate-400 hover:text-slate-800 mb-6 transition font-medium text-sm gap-2">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>

            <div class="card-base bg-white p-8 md:p-10">
                <div class="flex items-center gap-4 mb-8 pb-8 border-b border-slate-100">
                    <div class="w-12 h-12 bg-slate-50 rounded-xl flex items-center justify-center text-slate-700 border border-slate-100">
                        <i class="fas fa-user-cog text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900">Account Settings</h1>
                        <p class="text-sm text-slate-500">Manage your profile and preferences.</p>
                    </div>
                </div>

                <div class="space-y-8">
                    <div class="grid gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase mb-2 tracking-wide">Display Name</label>
                            <div class="flex gap-3">
                                <input type="text" id="name" value="{{ current_user.name }}" class="flex-1 bg-slate-50 border border-slate-200 rounded-lg px-4 py-2.5 text-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:bg-white transition">
                                <button id="update-btn" class="bg-slate-900 text-white px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-black transition shadow-sm">Save Changes</button>
                            </div>
                        </div>

                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 tracking-wide">Email Address</label>
                                <input type="text" value="{{ current_user.email }}" readonly class="w-full bg-slate-50/50 border border-slate-100 rounded-lg px-4 py-2.5 text-slate-400 cursor-not-allowed">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase mb-2 tracking-wide">Reference</label>
                                <input type="text" value="{{ current_user.reference or 'N/A' }}" readonly class="w-full bg-slate-50/50 border border-slate-100 rounded-lg px-4 py-2.5 text-slate-400 cursor-not-allowed">
                            </div>
                        </div>
                    </div>
                    
                    <div class="pt-8 border-t border-slate-100">
                        <h3 class="text-xs font-bold text-red-500 uppercase mb-4 tracking-wide">Danger Zone</h3>
                        <div class="bg-red-50/50 rounded-xl p-5 border border-red-100 flex flex-col md:flex-row items-center justify-between gap-4">
                            <div>
                                <h4 class="text-sm font-bold text-slate-700">Delete Account</h4>
                                <p class="text-xs text-slate-500 mt-1">Permanently remove your account and all data.</p>
                            </div>
                            <button id="delete-btn" class="px-4 py-2 bg-white border border-red-200 text-red-600 rounded-lg text-xs font-bold hover:bg-red-600 hover:text-white transition shadow-sm whitespace-nowrap">
                                Delete Account
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('update-btn').addEventListener('click', async () => {
            const name = document.getElementById('name').value;
            const btn = document.getElementById('update-btn');
            const originalText = btn.textContent;
            
            btn.textContent = 'Saving...';
            btn.disabled = true;

            const res = await fetch('/update_profile', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name })
            });
            
            btn.disabled = false;
            if(res.ok) {
                btn.textContent = 'Saved!';
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('bg-green-600');
                }, 2000);
            } else {
                btn.textContent = 'Error';
                alert('Failed to update.');
            }
        });

        document.getElementById('delete-btn').addEventListener('click', async () => {
            if(confirm('Are you absolutely sure? This action cannot be undone and will delete all your notes.')) {
                const res = await fetch('/delete_account', {method: 'POST'});
                const data = await res.json();
                if(data.success) window.location.href = data.redirect;
                else alert(data.error);
            }
        });
    </script>
</body>
</html>
