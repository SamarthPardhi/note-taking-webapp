<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Project Alpha</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .settings-page {
            max-width: 600px;
            margin: 0 auto;
            padding: 80px 24px;
        }

        .settings-header {
            margin-bottom: 48px;
        }

        .settings-header h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .settings-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .settings-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .settings-section h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .form-row {
            margin-bottom: 20px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }

        .form-input {
            width: 100%;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0 14px;
            font-size: 14px;
            color: var(--text);
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .save-btn {
            width: 100%;
            height: 44px;
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .save-btn:hover {
            opacity: 0.9;
        }

        .danger-zone {
            background: rgba(255, 59, 48, 0.05);
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        .danger-zone h2 {
            color: #ff3b30;
        }

        .delete-btn {
            width: 100%;
            height: 44px;
            background: transparent;
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.3);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: rgba(255, 59, 48, 0.1);
        }

        .back-link {
            display: inline-block;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .back-link:hover {
            color: var(--text);
        }

        .token-display {
            font-family: 'SF Mono', Monaco, monospace;
            letter-spacing: 0.1em;
            font-weight: 600;
        }

        .info-text {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="settings-page">
        <a href="{{ url_for('index') }}" class="back-link">← Back</a>

        <div class="settings-header">
            <h1>Settings</h1>
            <p>Manage your account</p>
        </div>

        <div class="settings-section">
            <h2>Profile</h2>
            <div class="form-row">
                <label class="form-label">Display Name</label>
                <input type="text" id="name" class="form-input" value="{{ current_user.name }}">
            </div>
            <div class="form-row">
                <label class="form-label">Email</label>
                <input type="text" class="form-input" value="{{ current_user.email }}" disabled>
            </div>
            <div class="form-row">
                <label class="form-label">Reference</label>
                <input type="text" class="form-input" value="{{ current_user.reference or 'N/A' }}" disabled>
            </div>
            <button class="save-btn" id="save-profile-btn">Save Changes</button>
        </div>

        <div class="settings-section">
            <h2>Access Token</h2>
            <div class="form-row">
                <label class="form-label">Current Token</label>
                <input type="text" class="form-input token-display" value="{{ current_user.token }}" disabled>
                <p class="info-text">Your current access token</p>
            </div>
            <button class="save-btn" id="regenerate-token-btn">Generate New Token</button>
            <p class="info-text" style="margin-top: 12px;">⚠️ This will invalidate your current token. You'll need to log in again.</p>
        </div>

        <div class="settings-section danger-zone">
            <h2>Delete Account</h2>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">
                This will permanently delete your account and all your notes. This action cannot be undone.
            </p>
            <button class="delete-btn" id="delete-btn">Delete Account</button>
        </div>
    </div>

    <script>
        const saveProfileBtn = document.getElementById('save-profile-btn');
        const nameInput = document.getElementById('name');
        const deleteBtn = document.getElementById('delete-btn');
        const regenerateTokenBtn = document.getElementById('regenerate-token-btn');

        saveProfileBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            if (!name) return;

            saveProfileBtn.textContent = 'Saving...';
            saveProfileBtn.disabled = true;

            try {
                const res = await fetch('/update_profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                if (res.ok) {
                    saveProfileBtn.textContent = 'Saved!';
                    setTimeout(() => {
                        saveProfileBtn.textContent = 'Save Changes';
                        saveProfileBtn.disabled = false;
                    }, 1500);
                } else {
                    saveProfileBtn.textContent = 'Error';
                    saveProfileBtn.disabled = false;
                }
            } catch (e) {
                saveProfileBtn.textContent = 'Error';
                saveProfileBtn.disabled = false;
            }
        });

        regenerateTokenBtn.addEventListener('click', async () => {
            if (confirm('Generate a new token? Your current token will stop working and you\'ll need to log in again.')) {
                regenerateTokenBtn.textContent = 'Generating...';
                regenerateTokenBtn.disabled = true;

                try {
                    const res = await fetch('/regenerate_token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });

                    const data = await res.json();

                    if (res.ok) {
                        alert(`Your new token is: ${data.token}\n\nPlease save it somewhere safe. You will be logged out now.`);
                        window.location.href = "{{ url_for('logout') }}";
                    } else {
                        alert(data.error || 'Failed to generate token');
                        regenerateTokenBtn.textContent = 'Generate New Token';
                        regenerateTokenBtn.disabled = false;
                    }
                } catch (e) {
                    alert('Network error. Please try again.');
                    regenerateTokenBtn.textContent = 'Generate New Token';
                    regenerateTokenBtn.disabled = false;
                }
            }
        });

        deleteBtn.addEventListener('click', async () => {
            if (confirm('Are you absolutely sure? This will delete all your notes forever.')) {
                if (confirm('Last chance. Really delete everything?')) {
                    try {
                        const res = await fetch('/delete_account', { method: 'POST' });
                        const data = await res.json();
                        
                        if (data.success) {
                            window.location.href = data.redirect;
                        } else {
                            alert(data.error || 'Failed to delete account');
                        }
                    } catch (e) {
                        alert('Network error. Please try again.');
                    }
                }
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                window.location.href = "{{ url_for('index') }}";
            }
        });
    </script>
</body>
</html>
